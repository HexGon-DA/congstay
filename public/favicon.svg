<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- Nền tròn xanh bộ đội, viền vàng (nền ngoài trong suốt) -->
  <circle cx="120" cy="120" r="114" fill="#2B3D2E" stroke="#DCAE42" stroke-width="6"/>
  <circle cx="120" cy="120" r="102" stroke="#DCAE42" stroke-width="1.5" opacity="0.85"/>

  <!-- Ngôi sao vàng năm cánh -->
  <polygon fill="#F5C242" stroke="#DCAE42" stroke-width="2" stroke-linejoin="round"
    points="120,34 126.58,52.94 146.63,53.35 130.65,65.46 136.46,84.65 120,73.2 103.54,84.65 109.35,65.46 93.37,53.35 113.42,52.94"/>

  <!-- Khung cửa sổ gỗ retro -->
  <rect x="72" y="102" width="96" height="88" rx="4" fill="#1E2B20" stroke="#DCAE42" stroke-width="5"/>
  <!-- Ô kính ánh đèn vàng ấm -->
  <rect x="77" y="107" width="41" height="38" fill="#DCAE42" opacity="0.28"/>
  <rect x="122" y="107" width="41" height="38" fill="#DCAE42" opacity="0.28"/>
  <rect x="77" y="150" width="41" height="35" fill="#DCAE42" opacity="0.14"/>
  <rect x="122" y="150" width="41" height="35" fill="#DCAE42" opacity="0.14"/>
  <!-- Nan cửa gỗ -->
  <line x1="120" y1="104" x2="120" y2="188" stroke="#DCAE42" stroke-width="4"/>
  <line x1="74" y1="147" x2="166" y2="147" stroke="#DCAE42" stroke-width="4"/>
  <!-- Bậu cửa -->
  <rect x="68" y="190" width="104" height="9" rx="2" fill="#DCAE42"/>
</svg>
