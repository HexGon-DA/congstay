<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <!-- Kraft Paper Textured Background -->
  <rect width="400" height="400" fill="#E8DEC9" rx="16"/>
  
  <!-- Subtle inner vintage border -->
  <rect x="12" y="12" width="376" height="376" stroke="#2B3D2E" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.4" rx="12"/>

  <!-- Chữ CỘNG màu xanh bộ đội thương hiệu -->
  <g id="cong-brand">
    <text x="190" y="180" text-anchor="middle" fill="#2B4B28" font-family="'Be Vietnam Pro', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="115" letter-spacing="-2">CỘNG</text>
    <text x="345" y="120" fill="#2B4B28" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="22">®</text>
  </g>

  <!-- Khối tem phiếu đỏ & dải viền đỏ đặc trưng -->
  <g id="red-banner">
    <rect x="75" y="200" width="250" height="34" fill="#A8322D" rx="2"/>
    <rect x="75" y="240" width="250" height="5" fill="#A8322D" rx="1"/>
  </g>

  <!-- Dòng chữ TIME CAPSULE HERITAGE STAY -->
  <g id="sub-branding" fill="#2B4B28" font-family="'Be Vietnam Pro', 'Montserrat', sans-serif" font-weight="800" text-anchor="middle">
    <text x="200" y="290" font-size="26" letter-spacing="4.5">TIME CAPSULE</text>
    <text x="200" y="325" font-size="24.5" letter-spacing="3.5">HERITAGE STAY</text>
  </g>
</svg>
